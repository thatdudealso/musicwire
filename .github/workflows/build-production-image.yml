name: Build production image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character release commit SHA. The image is built from this exact commit and published under it.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thatdudealso/musicwire

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Verify the tag names the tree being built
        run: |
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "${{ inputs.image_tag }}" ]; then
            echo "image_tag ${{ inputs.image_tag }} is not the full commit SHA of the built tree ($checked_out)." >&2
            exit 1
          fi

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the native AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.image_tag }}
