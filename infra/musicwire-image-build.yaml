AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role with least-privilege access to publish Musicwire production images.

Parameters:
  GitHubRepository:
    Type: String
    Default: thatdudealso/musicwire
    Description: GitHub repository allowed to assume the image-build role.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  ImageBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: musicwire-github-image-build
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:*'
      Policies:
        - PolicyName: publish-musicwire-image
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/musicwire'

Outputs:
  ImageBuildRoleArn:
    Description: Configure this non-secret ARN as MUSICWIRE_ECR_BUILD_ROLE_ARN in the GitHub repository.
    Value: !GetAtt ImageBuildRole.Arn
